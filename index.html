        // Returns the current CSS particle color (var(--particles)) from active theme
        function getCurrentParticleColor() {
            try {
                return getComputedStyle(document.documentElement).getPropertyValue('--particles').trim() || '#ffffff';
            } catch (e) { return '#ffffff'; }
        }

        // Builds full particles.js config with provided particle color
        function buildParticlesConfig(particleColor) {
            return {
                "particles": {
                    "number": { "value": 120, "density": { "enable": true, "value_area": 800 } },
                    "color": { "value": particleColor },
                    "shape": { "type": "circle" },
                    "opacity": { "value": 0.5, "random": true, "anim": { "enable": true, "speed": 1, "opacity_min": 0.1, "sync": false } },
                    "size": { "value": 3, "random": true, "anim": { "enable": true, "speed": 2, "size_min": 0.1, "sync": false } },
                    "line_linked": { "enable": false },
                    "move": { "enable": true, "speed": 0.8, "direction": "top-right", "random": true, "straight": false, "out_mode": "out" }
                },
                "interactivity": {
                    "detect_on": "canvas",
                    "events": { "onhover": { "enable": true, "mode": "bubble" }, "onclick": { "enable": true, "mode": "push" } },
                    "modes": { "bubble": { "distance": 250, "size": 0, "duration": 2, "opacity": 0, "speed": 3 }, "push": { "particles_nb": 4 } }
                }
            };
        }

        // Initialize particles using the currently active theme's particle color
        // (head preload script already set data-theme before this runs!)
        particlesJS("particles-js", buildParticlesConfig(getCurrentParticleColor()));

        // =============== THEME SWITCHER LOGIC ===============
        (function themeSwitcher() {
            const VALID_THEMES = ['sky', 'sakura', 'midnight', 'ocean', 'matcha'];
            const STORAGE_KEY = 'tufan_theme_v1';
            const html = document.documentElement;

            // Returns currently applied theme (from html[data-theme])
            function currentTheme() {
                const t = html.getAttribute('data-theme') || 'sky';
                return VALID_THEMES.indexOf(t) === -1 ? 'sky' : t;
            }

            // Updates active-check state in the theme menu UI
            function updateMenuUI(theme) {
                try {
                    const all = document.querySelectorAll('.theme-option');
                    const allChecks = document.querySelectorAll('.theme-check');
                    all.forEach(el => {
                        const isMatch = el.getAttribute('data-theme') === theme;
                        el.classList.toggle('active', isMatch);
                    });
                } catch (e) {}
            }

            // Rebuilds particles with the new theme's color
            function updateParticlesForTheme() {
                try {
                    const pContainer = document.getElementById('particles-js');
                    if (window.pJSDom && window.pJSDom[0] && window.pJSDom[0].pJS && typeof pJSDom[0].pJS.fn.vendors.destroypJS === 'function') {
                        pJSDom[0].pJS.fn.vendors.destroypJS();
                        window.pJSDom = [];
                    }
                    if (pContainer) pContainer.innerHTML = '';
                    particlesJS('particles-js', buildParticlesConfig(getCurrentParticleColor()));
                } catch (e) {
                    // Fallback - particles not ready, ignore
                }
            }

            // Applies a theme: data-attr -> localStorage -> UI particles
            function applyTheme(theme, persist) {
                if (VALID_THEMES.indexOf(theme) === -1) theme = 'sky';
                html.setAttribute('data-theme', theme);
                if (persist !== false) {
                    try { localStorage.setItem(STORAGE_KEY, theme); } catch (e) {}
                }
                updateMenuUI(theme);
                // Update particles after a tiny delay so CSS variables are recomputed for new theme
                setTimeout(updateParticlesForTheme, 50);
            }

            // Hook up click handlers for each theme option
            document.addEventListener('DOMContentLoaded', function () {
                // Apply initial (head script set it, but ensure menu UI state is synced)
                updateMenuUI(currentTheme());

                const options = document.querySelectorAll('.theme-option');
                options.forEach(btn => {
                    btn.addEventListener('click', function (e) {
                        e.preventDefault();
                        const theme = btn.getAttribute('data-theme');
                        applyTheme(theme, true);
                    });
                });
            });

            // Expose for debugging only: window.applyTheme()
            window.applyTheme = applyTheme;
        })();

            const endpoint = `${SUPABASE_URL}/rest/v1/rpc/register_visit`;
            const headers = {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                'Content-Type': 'application/json',
                'Cache-Control': 'no-store, no-cache, must-revalidate',
                'Accept': 'application/json'
            };

            async function callBackend(retry) {
                try {
                    console.log('[counter] 📤 POST ->', endpoint, 'with vid =', visitorId);
                    const ctrl = new AbortController();
                    const timeout = setTimeout(() => ctrl.abort(), 9000);
                    const r = await fetch(endpoint, {
                        method: 'POST',
                        headers,
                        body: JSON.stringify({ vid: visitorId }),
                        cache: 'no-store',
                        signal: ctrl.signal
                    });
                    clearTimeout(timeout);
                    const rawText = await r.text();
                    console.log('[counter] 📥 HTTP', r.status, 'raw body:', rawText);
                    if (r.status === 429 || r.status >= 500) throw new Error('retryable ' + r.status + ' body: ' + rawText.slice(0, 200));
                    if (!r.ok) throw new Error('http ' + r.status + ' ' + rawText.slice(0, 300));
                    let payload;
                    try { payload = JSON.parse(rawText); } catch(e) { throw new Error('bad json: ' + rawText.slice(0, 200)); }
                    payload = Array.isArray(payload) ? payload[0] : payload;
                    if (!payload || typeof payload.total !== 'number') throw new Error('bad payload structure: ' + rawText);
                    console.log('[counter] 🏁 Backend result -> counted:', payload.counted, '| TOTAL UNIQUE:', payload.total);
                    return payload;
                } catch (e) {
                    if (e.name === 'AbortError') throw new Error('timeout after 9s');
                    if (retry && retry > 0) {
                        await new Promise(rs => setTimeout(rs, 700 * (3 - retry)));
                        return callBackend(retry - 1);
                    }
                    throw e;
                }
            }

            try {
                /* ---------------- STEP 3: CALL THE SINGLE BACKEND RPC ONCE ---------------- */
                const result = await callBackend(2);

                /* ---------------- STEP 4: SMOOTHLY UPDATE UI + CACHE ---------------- */
                if (Number.isFinite(result.total) && result.total >= BASE_START) {
                    show(result.total);
                    writeCachedTotal(result.total);
                }
            } catch (err) {
                /* ---------------- STEP 5: API FAILURE — KEEP KNOWN COUNT, NO FAKING ---------------- */
                console.error('[counter] ❌ Backend unreachable - showing cached value only. Error:', err.message || err);
                show(readCachedTotal() || BASE_START);
            }
        })();

        // =============== FULL AUDIO PLAYER LOGIC ===============
        const audio = document.getElementById('bg-audio');
        const volumeSlider = document.getElementById('volume-slider');
        const sliderFill = document.getElementById('slider-fill');
        const volumePercent = document.getElementById('volume-percent');
        const muteBtn = document.getElementById('mute-btn');
        const audioBtn = document.getElementById('audio-btn');
        const audioMainIcon = document.getElementById('audio-main-icon');
        const trackBtn = document.getElementById('track-btn');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const playPauseIcon = document.getElementById('play-pause-icon');
        const playPauseText = document.getElementById('play-pause-text');
        const trackName = document.getElementById('track-name');
        const trackIndex = document.getElementById('track-index');

        // =============== PLAYLIST - Add your songs here! ===============
        // 1. Put .mp3 files inside the music/ folder
        // 2. Add entries below matching filenames + display name
        // Example: { file: 'music/your-song.mp3', name: 'Song Name - Artist' }
        const playlist = [
            { file: 'music/song1.mp3', name: 'Track 1' },
            { file: 'music/song2.mp3', name: 'Track 2' },
            { file: 'music/song3.mp3', name: 'Track 3' }
        ];

        let currentTrack = 0;
        let lastVolume = 50;
        let isMuted = false;
        let isPlaying = false;

        // Initial volume
        audio.volume = 0.5;

        function pad(n) { return n < 10 ? '0' + n : '' + n; }

        function updateVolumeUI(value) {
            const percent = value + '%';
            sliderFill.style.width = percent;
            volumePercent.textContent = percent;
        }

        function updateMuteUI() {
            const icon = muteBtn.querySelector('i');
            const text = muteBtn.querySelector('span');
            if (isMuted || Number(volumeSlider.value) === 0) {
                icon.className = 'fas fa-volume-mute text-sm text-white/70';
                text.textContent = 'Unmute';
            } else {
                icon.className = 'fas fa-volume-up text-sm text-white/70';
                text.textContent = 'Mute';
            }
        }

        function updatePlayStateUI() {
            if (isPlaying) {
                playPauseIcon.className = 'fas fa-pause text-sm text-white/70';
                playPauseText.textContent = 'Pause';
                audioMainIcon.className = 'fas fa-headphones text-xl text-sky-300 group-hover:text-white transition-colors';
                audioBtn.classList.add('is-playing-glow');
            } else {
                playPauseIcon.className = 'fas fa-play text-sm text-white/70';
                playPauseText.textContent = 'Play';
                audioMainIcon.className = 'fas fa-music text-xl text-sky-400 group-hover:text-white transition-colors';
                audioBtn.classList.remove('is-playing-glow');
            }
        }

        function updateTrackUI() {
            const track = playlist[currentTrack];
            if (!track) {
                trackName.textContent = 'Add songs to music/';
                trackIndex.textContent = '00 / 00';
                return;
            }
            trackName.textContent = track.name;
            trackIndex.textContent = pad(currentTrack + 1) + ' / ' + pad(playlist.length);
        }

        function loadTrack(index, autoplay = false) {
            if (playlist.length === 0) return;
            currentTrack = (index + playlist.length) % playlist.length;
            const track = playlist[currentTrack];
            audio.src = track.file;
            audio.load();
            updateTrackUI();
            if (autoplay) {
                playAudio();
            }
        }

        function playAudio() {
            if (playlist.length === 0) {
                trackName.textContent = '⚠️ Put MP3s in music/ folder';
                trackName.style.color = '#f87171';
                setTimeout(() => { trackName.style.color = ''; updateTrackUI(); }, 2500);
                return;
            }
            audio.play().then(() => {
                isPlaying = true;
                updatePlayStateUI();
            }).catch(err => {
                console.warn('Autoplay blocked - click Play button manually:', err);
                isPlaying = false;
                updatePlayStateUI();
            });
        }

        function pauseAudio() {
            audio.pause();
            isPlaying = false;
            updatePlayStateUI();
        }

        function togglePlayPause() {
            if (isPlaying) pauseAudio();
            else playAudio();
        }

        // =============== EVENT LISTENERS ===============

        // Big audio button = toggle play/pause
        audioBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (!audio.src && playlist.length > 0) loadTrack(0, true);
            else togglePlayPause();
        });

        // Play/Pause button inside sound bar
        playPauseBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (!audio.src && playlist.length > 0) loadTrack(0, true);
            else togglePlayPause();
        });

        // Next Track button
        trackBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const wasPlaying = isPlaying;
            loadTrack(currentTrack + 1, wasPlaying);
        });

        // Volume slider
        volumeSlider.addEventListener('input', (e) => {
            const value = Number(e.target.value);
            audio.volume = value / 100;
            updateVolumeUI(value);
            if (value > 0) {
                isMuted = false;
                audio.muted = false;
                lastVolume = value;
            } else {
                isMuted = true;
                audio.muted = true;
            }
            updateMuteUI();
        });

        // Mute button
        muteBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (isMuted || audio.muted) {
                isMuted = false;
                audio.muted = false;
                const restore = lastVolume > 0 ? lastVolume : 50;
                volumeSlider.value = restore;
                audio.volume = restore / 100;
                updateVolumeUI(restore);
            } else {
                isMuted = true;
                audio.muted = true;
                lastVolume = Number(volumeSlider.value) || 50;
                volumeSlider.value = 0;
                updateVolumeUI(0);
            }
            updateMuteUI();
        });

        // Auto-next when song ends (cycle playlist)
        audio.addEventListener('ended', () => {
            loadTrack(currentTrack + 1, true);
        });

        audio.addEventListener('error', () => {
            trackName.textContent = '⚠️ File missing: ' + (playlist[currentTrack]?.file || '');
            trackName.style.color = '#f87171';
        });

        // =============== AUTO-PLAY ON PAGE LOAD ===============
        function tryAutoplay() {
            if (playlist.length === 0) return;
            loadTrack(0, false);

            // Strategy 1: Try normal autoplay first
            audio.play().then(() => {
                isPlaying = true;
                updatePlayStateUI();
            }).catch(() => {
                // Strategy 2: Try autoplay MUTED (browsers allow muted autoplay)
                audio.muted = true;
                isMuted = true;
                updateMuteUI();
                audio.play().then(() => {
                    isPlaying = true;
                    updatePlayStateUI();
                    // Show hint that user can unmute
                    trackName.textContent = '🔇 Playing muted - click Mute to unmute';
                    trackName.style.color = '#38bdf8';
                    setTimeout(() => { trackName.style.color = ''; updateTrackUI(); }, 4000);
                }).catch(() => {
                    // Strategy 3: Wait for FIRST user interaction anywhere
                    trackName.textContent = '👆 Click anywhere to start music';
                    trackName.style.color = '#facc15';
                    const startOnInteract = () => {
                        audio.muted = false;
                        isMuted = false;
                        audio.volume = 0.5;
                        volumeSlider.value = 50;
                        updateVolumeUI(50);
                        updateMuteUI();
                        playAudio();
                        document.removeEventListener('click', startOnInteract);
                        document.removeEventListener('scroll', startOnInteract);
                        document.removeEventListener('keydown', startOnInteract);
                        document.removeEventListener('touchstart', startOnInteract);
                    };
                    document.addEventListener('click', startOnInteract);
                    document.addEventListener('scroll', startOnInteract);
                    document.addEventListener('keydown', startOnInteract);
                    document.addEventListener('touchstart', startOnInteract);
                });
            });
        }

        // Kick off autoplay after a tiny delay so page loads first
        window.addEventListener('load', () => {
            setTimeout(tryAutoplay, 600);
        });

        // Init UI
        updateTrackUI();
        updatePlayStateUI();
        updateMuteUI();
    </script>
</body>
</html>
