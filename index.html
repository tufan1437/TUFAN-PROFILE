    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        /* =============== PARTICLES + THEME SWITCHER =============== */

        // Returns the current CSS particle color (var(--particles)) from active theme
        function getCurrentParticleColor() {
            try {
                return getComputedStyle(document.documentElement).getPropertyValue('--particles').trim() || '#ffffff';
            } catch (e) { return '#ffffff'; }
        }

        // Builds full particles.js config with provided particle color
        function buildParticlesConfig(particleColor) {
            return {
                "particles": {
                    "number": { "value": 120, "density": { "enable": true, "value_area": 800 } },
                    "color": { "value": particleColor },
                    "shape": { "type": "circle" },
                    "opacity": { "value": 0.5, "random": true, "anim": { "enable": true, "speed": 1, "opacity_min": 0.1, "sync": false } },
                    "size": { "value": 3, "random": true, "anim": { "enable": true, "speed": 2, "size_min": 0.1, "sync": false } },
                    "line_linked": { "enable": false },
                    "move": { "enable": true, "speed": 0.8, "direction": "top-right", "random": true, "straight": false, "out_mode": "out" }
                },
                "interactivity": {
                    "detect_on": "canvas",
                    "events": { "onhover": { "enable": true, "mode": "bubble" }, "onclick": { "enable": true, "mode": "push" } },
                    "modes": { "bubble": { "distance": 250, "size": 0, "duration": 2, "opacity": 0, "speed": 3 }, "push": { "particles_nb": 4 } }
                }
            };
        }

        // Initialize particles using the currently active theme's particle color
        // (head preload script already set data-theme before this runs!)
        particlesJS("particles-js", buildParticlesConfig(getCurrentParticleColor()));

        // =============== THEME SWITCHER + AUTO-SHOWCASE ROTATION ===============
        (function themeSwitcher() {
            const VALID_THEMES = ['sky', 'sakura', 'midnight', 'ocean', 'matcha'];
            // Metadata for nice display + next-theme preview swatches
            const THEME_META = {
                sky:      { name: 'Default Sky',  gradient: 'from-sky-300 via-blue-500 to-cyan-500' },
                sakura:   { name: 'Sakura Pink',  gradient: 'from-pink-300 via-rose-400 to-red-500' },
                midnight: { name: 'Midnight Dark',gradient: 'from-indigo-500 via-purple-600 to-fuchsia-700' },
                ocean:    { name: 'Ocean Neon',   gradient: 'from-cyan-300 via-teal-500 to-blue-600' },
                matcha:   { name: 'Matcha Sage',  gradient: 'from-lime-400 via-emerald-500 to-teal-600' }
            };
            const STORAGE_KEY = 'tufan_theme_v1';
            const html = document.documentElement;
            const ROTATE_EVERY = 6;     // seconds before auto-changing theme (total = 5 countdowns + 1s wait = 6)
            const DISPLAY_COUNTDOWN = 5;// shown number of seconds in message

            /* ---------- Showcase state ---------- */
            let isShowcaseActive = true; // rotation ON by default
            let currentIndex = 0;        // starts at 0 = Default Sky (per user request)
            let secondsLeft = DISPLAY_COUNTDOWN;
            let countdownInterval = null;
            let rotationTimeout = null;
            let toastShown = false;

            // ---------- Standard helpers ----------
            function currentTheme() {
                const t = html.getAttribute('data-theme') || 'sky';
                return VALID_THEMES.indexOf(t) === -1 ? 'sky' : t;
            }
            function updateMenuUI(theme) {
                try {
                    document.querySelectorAll('.theme-option').forEach(el => {
                        const match = el.getAttribute('data-theme') === theme;
                        el.classList.toggle('active', match);
                    });
                } catch (e) {}
            }
            function updateParticlesForTheme() {
                try {
                    const pContainer = document.getElementById('particles-js');
                    if (window.pJSDom && window.pJSDom[0] && window.pJSDom[0].pJS && typeof pJSDom[0].pJS.fn.vendors.destroypJS === 'function') {
                        pJSDom[0].pJS.fn.vendors.destroypJS();
                        window.pJSDom = [];
                    }
                    if (pContainer) pContainer.innerHTML = '';
                    particlesJS('particles-js', buildParticlesConfig(getCurrentParticleColor()));
                } catch (e) {}
            }
            /* applyTheme - also calls showThemeChangeFlash() */
            function applyTheme(theme, persist, causedByRotation) {
                if (VALID_THEMES.indexOf(theme) === -1) theme = 'sky';
                html.setAttribute('data-theme', theme);
                if (persist !== false) {
                    try { localStorage.setItem(STORAGE_KEY, theme); } catch (e) {}
                }
                currentIndex = Math.max(0, VALID_THEMES.indexOf(theme));
                updateMenuUI(theme);
                setTimeout(updateParticlesForTheme, 50);
                if (causedByRotation) showThemeChangeFlash();
            }

            // ---------- Showcase toast UI controls ----------
            function getToastEls() {
                return {
                    toast:     document.getElementById('theme-rotate-toast'),
                    countdown: document.getElementById('toast-countdown'),
                    progress:  document.getElementById('toast-progress'),
                    nextName:  document.getElementById('next-theme-name'),
                    nextSwatch:document.getElementById('next-theme-swatch'),
                    chip:      document.getElementById('rotate-chip'),
                    stopBtn:   document.getElementById('btn-stop-rotate'),
                    resumeChip:document.getElementById('theme-resume-chip'),
                    resumeBtn: document.getElementById('btn-resume-rotate'),
                    msg:       document.getElementById('toast-message'),
                    rotateIcon:document.getElementById('rotate-icon')
                };
            }
            function nextThemeKey() {
                return VALID_THEMES[(currentIndex + 1) % VALID_THEMES.length];
            }
            function updateNextPreview() {
                const ui = getToastEls();
                if (!ui.nextName) return;
                const next = nextThemeKey();
                const meta = THEME_META[next];
                ui.nextName.textContent = meta.name;
                // Clear any old gradient classes - replace with new one
                ui.nextSwatch.className = ui.nextSwatch.className
                    .replace(/(from|via|to)-\S+/g, '').replace(/\s+/g,' ').trim();
                ui.nextSwatch.classList.add('bg-gradient-to-br');
                meta.gradient.split(' ').forEach(cls => ui.nextSwatch.classList.add(cls));
            }
            function showToast() {
                const ui = getToastEls();
                if (!ui.toast || toastShown) return;
                toastShown = true;
                ui.toast.classList.add('show');
            }
            function hideToast() {
                const ui = getToastEls();
                if (!ui.toast) return;
                toastShown = false;
                ui.toast.classList.remove('show');
            }
            function setCountdownNumber(num, animatePop) {
                const ui = getToastEls();
                if (!ui.countdown) return;
                ui.countdown.textContent = String(num);
                if (animatePop) {
                    ui.countdown.classList.remove('toast-countdown-tick');
                    // force reflow for animation restart
                    void ui.countdown.offsetWidth;
                    ui.countdown.classList.add('toast-countdown-tick');
                }
                const pct = Math.max(0, Math.min(100, (num / DISPLAY_COUNTDOWN) * 100));
                if (ui.progress) ui.progress.style.width = pct + '%';
            }
            function setChipStatus(active) {
                const ui = getToastEls();
                if (!ui.chip) return;
                if (active) {
                    ui.chip.innerHTML = `<span class="w-1.5 h-1.5 rounded-full animate-pulse" style="background: var(--accent); box-shadow: var(--text-glow-accent);"></span> Active`;
                } else {
                    ui.chip.innerHTML = `<span class="w-1.5 h-1.5 rounded-full" style="background: #a3a3a3;"></span> Paused`;
                }
            }
            function showResumeChip(show) {
                const ui = getToastEls();
                if (!ui.resumeChip) return;
                if (show) ui.resumeChip.classList.add('show');
                else      ui.resumeChip.classList.remove('show');
            }
            function showThemeChangeFlash() {
                const el = document.createElement('div');
                el.className = 'theme-change-flash';
                document.body.appendChild(el);
                // Also toast-flash briefly
                const ui = getToastEls();
                if (ui.toast) {
                    ui.toast.classList.remove('changing');
                    void ui.toast.offsetWidth;
                    ui.toast.classList.add('changing');
                }
                setTimeout(() => { try { document.body.removeChild(el); } catch(e){} }, 900);
            }

            // ---------- Showcase: Countdown + Rotation Loop ----------
            function tickCountdown() {
                if (!isShowcaseActive) return;
                secondsLeft -= 1;
                if (secondsLeft < 0) {
                    rotateNextTheme();
                    return;
                }
                setCountdownNumber(secondsLeft, true);
            }
            function rotateNextTheme() {
                const next = nextThemeKey();
                applyTheme(next, false, true);
                updateNextPreview();
                // Reset countdown
                secondsLeft = DISPLAY_COUNTDOWN;
                setCountdownNumber(secondsLeft, true);
            }
            function startShowcase() {
                stopShowcaseTimers(false);
                isShowcaseActive = true;
                showToast();
                setChipStatus(true);
                showResumeChip(false);
                updateNextPreview();
                // Initialize: on page open we start at theme #0 (Default Sky), first change will be to #1 (Sakura) after 5s
                secondsLeft = DISPLAY_COUNTDOWN;
                setCountdownNumber(secondsLeft, false);
                countdownInterval = setInterval(tickCountdown, 1000);
            }
            function stopShowcaseTimers(hideToastFlag) {
                if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
                if (rotationTimeout)  { clearTimeout(rotationTimeout);  rotationTimeout  = null; }
                if (hideToastFlag) hideToast();
            }
            function pauseShowcase(userInitiated) {
                if (!isShowcaseActive && !userInitiated) return;
                stopShowcaseTimers(true);
                isShowcaseActive = false;
                setChipStatus(false);
                if (userInitiated) {
                    // Show the small "Showcase paused - click to resume" chip
                    showResumeChip(true);
                }
            }

            // ---------- On DOM Ready: wire handlers + start showcase ----------
            document.addEventListener('DOMContentLoaded', function () {
                // 1) Initial sync
                updateMenuUI(currentTheme());
                updateNextPreview();

                // 2) Theme option clicks: user manually picks -> PAUSE showcase, keep choice
                document.querySelectorAll('.theme-option').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        const theme = btn.getAttribute('data-theme');
                        pauseShowcase(true); // showcase STOPS when user picks manually
                        applyTheme(theme, true, false);
                    });
                });

                // 3) Stop button on the toast
                const ui = getToastEls();
                if (ui.stopBtn) {
                    ui.stopBtn.addEventListener('click', () => pauseShowcase(true));
                }
                // 4) Resume chip
                if (ui.resumeBtn) {
                    ui.resumeBtn.addEventListener('click', () => {
                        applyTheme('sky', false, false); // user clicks resume: reset to Default Sky (per user rule)
                        currentIndex = 0;
                        startShowcase();
                    });
                }

                // 5) Start rotation after short 1.4s delay so page fade-in completes first
                setTimeout(startShowcase, 1400);
            });

            window.applyTheme = applyTheme;
        })();

        /* ============================================================
         *  PRODUCTION UNIQUE-VISITOR COUNTER
         *  Architecture:
         *    Frontend (index.html) → Supabase Postgres REST API
         *    DB = source of truth. localStorage = identity + UI cache ONLY.
         *
         *  SETUP: Create a free Supabase project, run the SQL init
         *  from the instructions, then paste your URL + anon key below.
         * ============================================================ */
        (async function viewCounter() {
            /* ---------------- CONFIG ---------------- */
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtraHFlbXprbWpkdnNkemt3ZXpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5ODYxNTYsImV4cCI6MjEwMzU2MjE1Nn0.OHks5MSoiExZiwXUHcl2MUHzAxDJkpBxoVPvtT-gz2Y';
            const BASE_START = 1377;
            const VISITOR_ID_KEY = 'tufan_visitor_uuid_v3';
            const CACHED_TOTAL_KEY = 'tufan_cached_total_v3';

            /* ★★★ AUTO-DETECT PROJECT REF FROM THE ANON JWT — 100% NO TYPOS ★★★
               The JWT payload always contains the exact "ref" (project id) that the
               anon key was issued for. This eliminates ALL possible URL typos.  */
            let SUPABASE_PROJECT_REF = '';
            try {
                const jwtPayloadB64 = SUPABASE_ANON_KEY.split('.')[1];
                SUPABASE_PROJECT_REF = JSON.parse(atob(jwtPayloadB64)).ref || '';
            } catch (e) { SUPABASE_PROJECT_REF = ''; }
            const SUPABASE_URL = SUPABASE_PROJECT_REF
                ? `https://${SUPABASE_PROJECT_REF}.supabase.co`
                : '';

            // Clear every old key from all previous broken counter versions
            try {
                Object.keys(localStorage)
                    .filter(k => k.startsWith('tufan_') || k.includes('visitor') || k.includes('counter') || k.includes('cached_total'))
                    .forEach(k => {
                        if (k !== VISITOR_ID_KEY && k !== CACHED_TOTAL_KEY) localStorage.removeItem(k);
                    });
            } catch(e) {}

            /* ---------------- HELPERS ---------------- */
            const viewEl = document.getElementById('view-count');

            function show(n) {
                viewEl.innerText = Math.max(BASE_START, Math.floor(n)).toLocaleString();
            }

            function readCachedTotal() {
                try {
                    const n = parseInt(localStorage.getItem(CACHED_TOTAL_KEY) || '0', 10);
                    return Number.isFinite(n) && n > 0 ? n : 0;
                } catch (e) { return 0; }
            }

            function writeCachedTotal(n) {
                try { localStorage.setItem(CACHED_TOTAL_KEY, String(n)); } catch (e) {}
            }

            function cryptoUUID() {
                if (crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
                return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                    const r = (crypto.getRandomValues(new Uint8Array(1))[0] & 0xf);
                    const v = c === 'x' ? r : (r & 0x3) | 0x8;
                    return v.toString(16);
                });
            }

            function getOrCreateVisitorId() {
                try {
                    let id = localStorage.getItem(VISITOR_ID_KEY);
                    if (!id || id.length < 10) {
                        id = cryptoUUID();
                        localStorage.setItem(VISITOR_ID_KEY, id);
                        console.log('[counter] ✨ NEW visitor v3 created ->', id);
                    } else {
                        console.log('[counter] 🔁 Returning visitor v3 ->', id);
                    }
                    return id;
                } catch (e) {
                    const id = cryptoUUID();
                    console.log('[counter] ⚠️ localStorage unavailable, using ephemeral id ->', id);
                    return id;
                }
            }

            /* ---------------- STEP 1: INSTANT RENDER FROM CACHE ---------------- */
            const cachedTotal = readCachedTotal();
            const initialShow = cachedTotal > 0 ? cachedTotal : BASE_START;
            console.log('[counter] ⚡ Instant paint from cache ->', initialShow);
            show(initialShow);

            /* ---------------- STEP 2: SANITY CHECKS ---------------- */
            if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
                console.error('[counter] ❌ Could not extract project ref from JWT - aborting');
                return;
            }
            console.log('[counter] 🎯 Auto-detected Supabase URL FROM JWT ->', SUPABASE_URL);

            const visitorId = getOrCreateVisitorId();
            const endpoint = `${SUPABASE_URL}/rest/v1/rpc/register_visit`;
            const headers = {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                'Content-Type': 'application/json',
                'Cache-Control': 'no-store, no-cache, must-revalidate',
                'Accept': 'application/json'
            };

            async function callBackend(retry) {
                try {
                    console.log('[counter] 📤 POST ->', endpoint, 'with vid =', visitorId);
                    const ctrl = new AbortController();
                    const timeout = setTimeout(() => ctrl.abort(), 9000);
                    const r = await fetch(endpoint, {
                        method: 'POST',
                        headers,
                        body: JSON.stringify({ vid: visitorId }),
                        cache: 'no-store',
                        signal: ctrl.signal
                    });
                    clearTimeout(timeout);
                    const rawText = await r.text();
                    console.log('[counter] 📥 HTTP', r.status, 'raw body:', rawText);
                    if (r.status === 429 || r.status >= 500) throw new Error('retryable ' + r.status + ' body: ' + rawText.slice(0, 200));
                    if (!r.ok) throw new Error('http ' + r.status + ' ' + rawText.slice(0, 300));
                    let payload;
                    try { payload = JSON.parse(rawText); } catch(e) { throw new Error('bad json: ' + rawText.slice(0, 200)); }
                    payload = Array.isArray(payload) ? payload[0] : payload;
                    if (!payload || typeof payload.total !== 'number') throw new Error('bad payload structure: ' + rawText);
                    console.log('[counter] 🏁 Backend result -> counted:', payload.counted, '| TOTAL UNIQUE:', payload.total);
                    return payload;
                } catch (e) {
                    if (e.name === 'AbortError') throw new Error('timeout after 9s');
                    if (retry && retry > 0) {
                        await new Promise(rs => setTimeout(rs, 700 * (3 - retry)));
                        return callBackend(retry - 1);
                    }
                    throw e;
                }
            }

            try {
                /* ---------------- STEP 3: CALL THE SINGLE BACKEND RPC ONCE ---------------- */
                const result = await callBackend(2);

                /* ---------------- STEP 4: SMOOTHLY UPDATE UI + CACHE ---------------- */
                if (Number.isFinite(result.total) && result.total >= BASE_START) {
                    show(result.total);
                    writeCachedTotal(result.total);
                }
            } catch (err) {
                /* ---------------- STEP 5: API FAILURE — KEEP KNOWN COUNT, NO FAKING ---------------- */
                console.error('[counter] ❌ Backend unreachable - showing cached value only. Error:', err.message || err);
                show(readCachedTotal() || BASE_START);
            }
        })();

        // =============== FULL AUDIO PLAYER LOGIC ===============
        const audio = document.getElementById('bg-audio');
        const volumeSlider = document.getElementById('volume-slider');
        const sliderFill = document.getElementById('slider-fill');
        const volumePercent = document.getElementById('volume-percent');
        const muteBtn = document.getElementById('mute-btn');
        const audioBtn = document.getElementById('audio-btn');
        const audioMainIcon = document.getElementById('audio-main-icon');
        const trackBtn = document.getElementById('track-btn');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const playPauseIcon = document.getElementById('play-pause-icon');
        const playPauseText = document.getElementById('play-pause-text');
        const trackName = document.getElementById('track-name');
        const trackIndex = document.getElementById('track-index');

        // =============== PLAYLIST - Add your songs here! ===============
        // 1. Put .mp3 files inside the music/ folder
        // 2. Add entries below matching filenames + display name
        // Example: { file: 'music/your-song.mp3', name: 'Song Name - Artist' }
        const playlist = [
            { file: 'music/song1.mp3', name: 'Track 1' },
            { file: 'music/song2.mp3', name: 'Track 2' },
            { file: 'music/song3.mp3', name: 'Track 3' }
        ];

        let currentTrack = 0;
        let lastVolume = 50;
        let isMuted = false;
        let isPlaying = false;

        // Initial volume
        audio.volume = 0.5;

        function pad(n) { return n < 10 ? '0' + n : '' + n; }

        function updateVolumeUI(value) {
            const percent = value + '%';
            sliderFill.style.width = percent;
            volumePercent.textContent = percent;
        }

        function updateMuteUI() {
            const icon = muteBtn.querySelector('i');
            const text = muteBtn.querySelector('span');
            if (isMuted || Number(volumeSlider.value) === 0) {
                icon.className = 'fas fa-volume-mute text-sm text-white/70';
                text.textContent = 'Unmute';
            } else {
                icon.className = 'fas fa-volume-up text-sm text-white/70';
                text.textContent = 'Mute';
            }
        }

        function updatePlayStateUI() {
            if (isPlaying) {
                playPauseIcon.className = 'fas fa-pause text-sm text-white/70';
                playPauseText.textContent = 'Pause';
                audioMainIcon.className = 'fas fa-headphones text-xl text-sky-300 group-hover:text-white transition-colors';
                audioBtn.classList.add('is-playing-glow');
            } else {
                playPauseIcon.className = 'fas fa-play text-sm text-white/70';
                playPauseText.textContent = 'Play';
                audioMainIcon.className = 'fas fa-music text-xl text-sky-400 group-hover:text-white transition-colors';
                audioBtn.classList.remove('is-playing-glow');
            }
        }

        function updateTrackUI() {
            const track = playlist[currentTrack];
            if (!track) {
                trackName.textContent = 'Add songs to music/';
                trackIndex.textContent = '00 / 00';
                return;
            }
            trackName.textContent = track.name;
            trackIndex.textContent = pad(currentTrack + 1) + ' / ' + pad(playlist.length);
        }

        function loadTrack(index, autoplay = false) {
            if (playlist.length === 0) return;
            currentTrack = (index + playlist.length) % playlist.length;
            const track = playlist[currentTrack];
            audio.src = track.file;
            audio.load();
            updateTrackUI();
            if (autoplay) {
                playAudio();
            }
        }

        function playAudio() {
            if (playlist.length === 0) {
                trackName.textContent = '⚠️ Put MP3s in music/ folder';
                trackName.style.color = '#f87171';
                setTimeout(() => { trackName.style.color = ''; updateTrackUI(); }, 2500);
                return;
            }
            audio.play().then(() => {
                isPlaying = true;
                updatePlayStateUI();
            }).catch(err => {
                console.warn('Autoplay blocked - click Play button manually:', err);
                isPlaying = false;
                updatePlayStateUI();
            });
        }

        function pauseAudio() {
            audio.pause();
            isPlaying = false;
            updatePlayStateUI();
        }

        function togglePlayPause() {
            if (isPlaying) pauseAudio();
            else playAudio();
        }

        // =============== EVENT LISTENERS ===============

        // Big audio button = toggle play/pause
        audioBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (!audio.src && playlist.length > 0) loadTrack(0, true);
            else togglePlayPause();
        });

        // Play/Pause button inside sound bar
        playPauseBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (!audio.src && playlist.length > 0) loadTrack(0, true);
            else togglePlayPause();
        });

        // Next Track button
        trackBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const wasPlaying = isPlaying;
            loadTrack(currentTrack + 1, wasPlaying);
        });

        // Volume slider
        volumeSlider.addEventListener('input', (e) => {
            const value = Number(e.target.value);
            audio.volume = value / 100;
            updateVolumeUI(value);
            if (value > 0) {
                isMuted = false;
                audio.muted = false;
                lastVolume = value;
            } else {
                isMuted = true;
                audio.muted = true;
            }
            updateMuteUI();
        });

        // Mute button
        muteBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (isMuted || audio.muted) {
                isMuted = false;
                audio.muted = false;
                const restore = lastVolume > 0 ? lastVolume : 50;
                volumeSlider.value = restore;
                audio.volume = restore / 100;
                updateVolumeUI(restore);
            } else {
                isMuted = true;
                audio.muted = true;
                lastVolume = Number(volumeSlider.value) || 50;
                volumeSlider.value = 0;
                updateVolumeUI(0);
            }
            updateMuteUI();
        });

        // Auto-next when song ends (cycle playlist)
        audio.addEventListener('ended', () => {
            loadTrack(currentTrack + 1, true);
        });

        audio.addEventListener('error', () => {
            trackName.textContent = '⚠️ File missing: ' + (playlist[currentTrack]?.file || '');
            trackName.style.color = '#f87171';
        });

        // =============== AUTO-PLAY ON PAGE LOAD ===============
        function tryAutoplay() {
            if (playlist.length === 0) return;
            loadTrack(0, false);

            // Strategy 1: Try normal autoplay first
            audio.play().then(() => {
                isPlaying = true;
                updatePlayStateUI();
            }).catch(() => {
                // Strategy 2: Try autoplay MUTED (browsers allow muted autoplay)
                audio.muted = true;
                isMuted = true;
                updateMuteUI();
                audio.play().then(() => {
                    isPlaying = true;
                    updatePlayStateUI();
                    // Show hint that user can unmute
                    trackName.textContent = '🔇 Playing muted - click Mute to unmute';
                    trackName.style.color = '#38bdf8';
                    setTimeout(() => { trackName.style.color = ''; updateTrackUI(); }, 4000);
                }).catch(() => {
                    // Strategy 3: Wait for FIRST user interaction anywhere
                    trackName.textContent = '👆 Click anywhere to start music';
                    trackName.style.color = '#facc15';
                    const startOnInteract = () => {
                        audio.muted = false;
                        isMuted = false;
                        audio.volume = 0.5;
                        volumeSlider.value = 50;
                        updateVolumeUI(50);
                        updateMuteUI();
                        playAudio();
                        document.removeEventListener('click', startOnInteract);
                        document.removeEventListener('scroll', startOnInteract);
                        document.removeEventListener('keydown', startOnInteract);
                        document.removeEventListener('touchstart', startOnInteract);
                    };
                    document.addEventListener('click', startOnInteract);
                    document.addEventListener('scroll', startOnInteract);
                    document.addEventListener('keydown', startOnInteract);
                    document.addEventListener('touchstart', startOnInteract);
                });
            });
        }

        // Kick off autoplay after a tiny delay so page loads first
        window.addEventListener('load', () => {
            setTimeout(tryAutoplay, 600);
        });

        // Init UI
        updateTrackUI();
        updatePlayStateUI();
        updateMuteUI();
    </script>
</body>
</html>
