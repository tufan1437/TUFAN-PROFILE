<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | @TUFAN1437</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=1.1">
</head>
<body class="bg-black text-white selection:bg-white/20">
    <div class="background-wrapper">
        <div class="background-image"></div>
    </div>
    <div id="particles-js"></div>

    <!-- Audio Player -->
    <audio id="bg-audio" loop preload="auto"></audio>

    <!-- Audio Control -->
    <div class="audio-control fixed left-6 top-6 z-50 group">
        <button id="audio-btn" class="audio-button relative flex items-center justify-center w-14 h-14 rounded-2xl glass-card border border-white/10 transition-all duration-300 overflow-hidden">
            <i id="audio-main-icon" class="fas fa-music text-xl text-sky-400 group-hover:text-white transition-colors"></i>
            <span class="sound-waves absolute inset-0 flex items-center justify-center gap-[2px] opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none">
                <span class="wave wave-1 bg-sky-400/80 rounded-full"></span>
                <span class="wave wave-2 bg-sky-400/80 rounded-full"></span>
                <span class="wave wave-3 bg-sky-400/80 rounded-full"></span>
                <span class="wave wave-4 bg-sky-400/80 rounded-full"></span>
                <span class="wave wave-5 bg-sky-400/80 rounded-full"></span>
            </span>
        </button>

        <!-- Sound Bar (Appears on Hover) -->
        <div class="sound-bar absolute left-full ml-4 top-0 px-5 py-4 rounded-2xl glass-card border border-white/10 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-400 translate-x-[-10px] group-hover:translate-x-0 min-w-[240px]">
            <!-- Now Playing -->
            <div class="mb-3 pb-3 border-b border-white/5">
                <div class="flex items-center justify-between mb-1">
                    <span class="text-[10px] font-bold uppercase tracking-[0.2em] text-sky-400/90">Now Playing</span>
                    <span id="track-index" class="text-[10px] font-bold text-white/50">01 / 03</span>
                </div>
                <div class="flex items-center gap-2 min-h-[24px]">
                    <i class="fas fa-play-circle text-sky-400 text-sm animate-pulse-play"></i>
                    <span id="track-name" class="text-sm font-bold text-white truncate">Add songs to music/</span>
                </div>
            </div>

            <!-- Volume Row -->
            <div class="flex items-center justify-between mb-3">
                <span class="text-[11px] font-bold uppercase tracking-[0.2em] text-sky-400">Sound</span>
                <span id="volume-percent" class="text-[11px] font-bold text-white/80">50%</span>
            </div>
            
            <div class="volume-slider-container relative mb-4">
                <input type="range" id="volume-slider" min="0" max="100" value="50" class="volume-slider w-full">
                <div class="slider-track absolute top-1/2 left-0 h-1.5 w-full -translate-y-1/2 rounded-full bg-white/10"></div>
                <div id="slider-fill" class="slider-fill absolute top-1/2 left-0 h-1.5 -translate-y-1/2 rounded-full bg-gradient-to-r from-sky-500 to-sky-300 w-1/2"></div>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center gap-2">
                <button id="play-pause-btn" class="flex-1 flex items-center justify-center gap-2 py-2 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 hover:border-white/20 transition-all duration-300">
                    <i id="play-pause-icon" class="fas fa-play text-sm text-white/70"></i>
                    <span id="play-pause-text" class="text-xs font-semibold text-white/80">Play</span>
                </button>
                <button id="mute-btn" class="flex-1 flex items-center justify-center gap-2 py-2 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 hover:border-white/20 transition-all duration-300">
                    <i class="fas fa-volume-up text-sm text-white/70"></i>
                    <span class="text-xs font-semibold text-white/80">Mute</span>
                </button>
                <button id="track-btn" class="flex-1 flex items-center justify-center gap-2 py-2 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 hover:border-white/20 transition-all duration-300">
                    <i class="fas fa-forward text-sm text-white/70"></i>
                    <span class="text-xs font-semibold text-white/80">Next</span>
                </button>
            </div>
        </div>
    </div>

    <main class="relative min-h-screen flex items-center justify-center p-4">
        <!-- Profile Container -->
        <div class="profile-container w-full max-w-[450px] relative z-10 animate-fade-in">
            <!-- Background Card -->
            <div class="glass-card rounded-[2rem] p-8 text-center overflow-hidden border border-white/5 relative">
                
                <!-- Profile Header -->
                <div class="relative mb-6">
                    <div class="inline-block shadow-2xl">
                        <img src="avatar.png" alt="Avatar" class="w-24 h-24 rounded-full object-cover border-2 border-white/20">
                    </div>
                    <div class="mt-4">
                        <div class="flex items-center justify-center">
                            <div class="relative">
                                <h1 class="text-3xl font-bold tracking-tight">TUFAN</h1>
                                <span class="verified-badge absolute left-full ml-2 top-1/2 -translate-y-1/2 bg-blue-500 text-[10px] px-1.5 py-0.5 rounded-md font-black uppercase">Verified</span>
                            </div>
                        </div>
                        <p class="text-zinc-400 text-sm mt-1 font-medium">@TUFAN1437</p>
                    </div>
                </div>

                <!-- Description / Bio -->
                <div class="bio-section mb-8 px-4 flex flex-col items-center">
                    <div class="about-me-tag inline-block mb-3 px-4 py-1.5 rounded-full bg-white/5 border border-white/10 w-fit">
                        <span class="text-xs font-bold uppercase tracking-[0.25em] text-sky-400">About Me</span>
                    </div>
                    <p class="text-white text-lg font-bold tracking-tight typewriter">
                        MY BIRTHDAY <span class="text-sky-400">2007/04/23</span>
                    </p>
                </div>

                <!-- Social Links -->
                <div class="links-container space-y-3">
                    <a href="https://discordapp.com/users/1223946132074270822" target="_blank" class="social-button group flex items-center justify-between p-4 rounded-2xl bg-white/5 border border-white/5 hover:bg-white/10 hover:border-white/20 transition-all duration-300">
                        <div class="flex items-center gap-3">
                            <i class="fab fa-discord text-xl text-[#5865F2]"></i>
                            <span class="font-semibold text-sm">Discord</span>
                        </div>
                        <i class="fas fa-chevron-right text-xs text-zinc-500 group-hover:text-white transition-colors"></i>
                    </a>

                    <a href="https://www.youtube.com/@TUFAN_1_OnLy/shorts" target="_blank" class="social-button group flex items-center justify-between p-4 rounded-2xl bg-white/5 border border-white/5 hover:bg-white/10 hover:border-white/20 transition-all duration-300">
                        <div class="flex items-center gap-3">
                            <i class="fab fa-youtube text-xl text-[#FF0000]"></i>
                            <span class="font-semibold text-sm">YouTube</span>
                        </div>
                        <i class="fas fa-chevron-right text-xs text-zinc-500 group-hover:text-white transition-colors"></i>
                    </a>

                    <a href="#" class="social-button group flex items-center justify-between p-4 rounded-2xl bg-white/5 border border-white/5 hover:bg-white/10 hover:border-white/20 transition-all duration-300">
                        <div class="flex items-center gap-3">
                            <i class="fab fa-instagram text-xl text-[#E4405F]"></i>
                            <span class="font-semibold text-sm">Instagram</span>
                        </div>
                        <i class="fas fa-chevron-right text-xs text-zinc-500 group-hover:text-white transition-colors"></i>
                    </a>

                    <a href="#" class="social-button group flex items-center justify-between p-4 rounded-2xl bg-white/5 border border-white/5 hover:bg-white/10 hover:border-white/20 transition-all duration-300">
                        <div class="flex items-center gap-3">
                            <i class="fas fa-envelope text-xl text-blue-400"></i>
                            <span class="font-semibold text-sm">Contact</span>
                        </div>
                        <i class="fas fa-chevron-right text-xs text-zinc-500 group-hover:text-white transition-colors"></i>
                    </a>
                </div>

                <!-- Footer / Badges -->
                <div class="mt-8 pt-6 border-t border-white/5 flex justify-center gap-4">
                    <i class="fab fa-spotify text-xl grayscale opacity-50 hover:grayscale-0 hover:opacity-100 transition-all duration-300 cursor-pointer"></i>
                    <a href="https://steamcommunity.com/profiles/76561199697287632/" target="_blank" class="grayscale opacity-50 hover:grayscale-0 hover:opacity-100 transition-all duration-300">
                        <i class="fab fa-steam text-xl"></i>
                    </a>
                    <i class="fab fa-twitch text-xl grayscale opacity-50 hover:grayscale-0 hover:opacity-100 transition-all duration-300 cursor-pointer"></i>
                </div>
            </div>

            <!-- Profile Views Counter (Floating) -->
            <div class="mt-4 text-center">
                <span class="text-[10px] text-white font-bold uppercase tracking-[0.2em] drop-shadow-[0_0_10px_rgba(255,255,255,0.3)]">
                    <i class="far fa-eye mr-1"></i> <span id="view-count">...</span> views
                </span>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 120, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#ffffff" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.5, "random": true, "anim": { "enable": true, "speed": 1, "opacity_min": 0.1, "sync": false } },
                "size": { "value": 3, "random": true, "anim": { "enable": true, "speed": 2, "size_min": 0.1, "sync": false } },
                "line_linked": { "enable": false },
                "move": { "enable": true, "speed": 0.8, "direction": "top-right", "random": true, "straight": false, "out_mode": "out" }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": { "onhover": { "enable": true, "mode": "bubble" }, "onclick": { "enable": true, "mode": "push" } },
                "modes": { "bubble": { "distance": 250, "size": 0, "duration": 2, "opacity": 0, "speed": 3 }, "push": { "particles_nb": 4 } }
            }
        });

        // View Counter Logic - UNIQUE VISITORS ONLY (1 count per user forever)
        async function updateViewCount() {
            try {
                const namespace = 'tufan-profile';
                const name = 'aura-views';
                const storageKey = 'tufan_unique_visitor_v3'; // Permanent (never cleared unless user wipes cache)
                const BASE_VIEWS = 1377;

                const alreadyCounted = localStorage.getItem(storageKey);

                // Only hit/increment if this user has NEVER been counted before
                const endpoint = alreadyCounted
                    ? `https://api.countapi.xyz/get/${namespace}/${name}`
                    : `https://api.countapi.xyz/hit/${namespace}/${name}`;

                const response = await fetch(endpoint);
                if (!response.ok) throw new Error('Counter API down');
                const data = await response.json();

                // Mark them as counted PERMANENTLY (even across sessions)
                if (!alreadyCounted) {
                    localStorage.setItem(storageKey, new Date().toISOString());
                }

                const realCount = (data.value || 0);
                const displayCount = BASE_VIEWS + realCount;
                document.getElementById('view-count').innerText = displayCount.toLocaleString();

            } catch (error) {
                console.warn('Counter API unreachable:', error);
                document.getElementById('view-count').innerText = '1,377+';
            }
        }
        updateViewCount();

        // =============== FULL AUDIO PLAYER LOGIC ===============
        const audio = document.getElementById('bg-audio');
        const volumeSlider = document.getElementById('volume-slider');
        const sliderFill = document.getElementById('slider-fill');
        const volumePercent = document.getElementById('volume-percent');
        const muteBtn = document.getElementById('mute-btn');
        const audioBtn = document.getElementById('audio-btn');
        const audioMainIcon = document.getElementById('audio-main-icon');
        const trackBtn = document.getElementById('track-btn');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const playPauseIcon = document.getElementById('play-pause-icon');
        const playPauseText = document.getElementById('play-pause-text');
        const trackName = document.getElementById('track-name');
        const trackIndex = document.getElementById('track-index');

        // =============== PLAYLIST - Add your songs here! ===============
        // 1. Put .mp3 files inside the music/ folder
        // 2. Add entries below matching filenames + display name
        // Example: { file: 'music/your-song.mp3', name: 'Song Name - Artist' }
        const playlist = [
            { file: 'music/song1.mp3', name: 'Track 1' },
            { file: 'music/song2.mp3', name: 'Track 2' },
            { file: 'music/song3.mp3', name: 'Track 3' }
        ];

        let currentTrack = 0;
        let lastVolume = 50;
        let isMuted = false;
        let isPlaying = false;

        // Initial volume
        audio.volume = 0.5;

        function pad(n) { return n < 10 ? '0' + n : '' + n; }

        function updateVolumeUI(value) {
            const percent = value + '%';
            sliderFill.style.width = percent;
            volumePercent.textContent = percent;
        }

        function updateMuteUI() {
            const icon = muteBtn.querySelector('i');
            const text = muteBtn.querySelector('span');
            if (isMuted || Number(volumeSlider.value) === 0) {
                icon.className = 'fas fa-volume-mute text-sm text-white/70';
                text.textContent = 'Unmute';
            } else {
                icon.className = 'fas fa-volume-up text-sm text-white/70';
                text.textContent = 'Mute';
            }
        }

        function updatePlayStateUI() {
            if (isPlaying) {
                playPauseIcon.className = 'fas fa-pause text-sm text-white/70';
                playPauseText.textContent = 'Pause';
                audioMainIcon.className = 'fas fa-headphones text-xl text-sky-300 group-hover:text-white transition-colors';
                audioBtn.classList.add('is-playing-glow');
            } else {
                playPauseIcon.className = 'fas fa-play text-sm text-white/70';
                playPauseText.textContent = 'Play';
                audioMainIcon.className = 'fas fa-music text-xl text-sky-400 group-hover:text-white transition-colors';
                audioBtn.classList.remove('is-playing-glow');
            }
        }

        function updateTrackUI() {
            const track = playlist[currentTrack];
            if (!track) {
                trackName.textContent = 'Add songs to music/';
                trackIndex.textContent = '00 / 00';
                return;
            }
            trackName.textContent = track.name;
            trackIndex.textContent = pad(currentTrack + 1) + ' / ' + pad(playlist.length);
        }

        function loadTrack(index, autoplay = false) {
            if (playlist.length === 0) return;
            currentTrack = (index + playlist.length) % playlist.length;
            const track = playlist[currentTrack];
            audio.src = track.file;
            audio.load();
            updateTrackUI();
            if (autoplay) {
                playAudio();
            }
        }

        function playAudio() {
            if (playlist.length === 0) {
                trackName.textContent = '⚠️ Put MP3s in music/ folder';
                trackName.style.color = '#f87171';
                setTimeout(() => { trackName.style.color = ''; updateTrackUI(); }, 2500);
                return;
            }
            audio.play().then(() => {
                isPlaying = true;
                updatePlayStateUI();
            }).catch(err => {
                console.warn('Autoplay blocked - click Play button manually:', err);
                isPlaying = false;
                updatePlayStateUI();
            });
        }

        function pauseAudio() {
            audio.pause();
            isPlaying = false;
            updatePlayStateUI();
        }

        function togglePlayPause() {
            if (isPlaying) pauseAudio();
            else playAudio();
        }

        // =============== EVENT LISTENERS ===============

        // Big audio button = toggle play/pause
        audioBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (!audio.src && playlist.length > 0) loadTrack(0, true);
            else togglePlayPause();
        });

        // Play/Pause button inside sound bar
        playPauseBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (!audio.src && playlist.length > 0) loadTrack(0, true);
            else togglePlayPause();
        });

        // Next Track button
        trackBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const wasPlaying = isPlaying;
            loadTrack(currentTrack + 1, wasPlaying);
        });

        // Volume slider
        volumeSlider.addEventListener('input', (e) => {
            const value = Number(e.target.value);
            audio.volume = value / 100;
            updateVolumeUI(value);
            if (value > 0) {
                isMuted = false;
                audio.muted = false;
                lastVolume = value;
            } else {
                isMuted = true;
                audio.muted = true;
            }
            updateMuteUI();
        });

        // Mute button
        muteBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (isMuted || audio.muted) {
                isMuted = false;
                audio.muted = false;
                const restore = lastVolume > 0 ? lastVolume : 50;
                volumeSlider.value = restore;
                audio.volume = restore / 100;
                updateVolumeUI(restore);
            } else {
                isMuted = true;
                audio.muted = true;
                lastVolume = Number(volumeSlider.value) || 50;
                volumeSlider.value = 0;
                updateVolumeUI(0);
            }
            updateMuteUI();
        });

        // Auto-next when song ends (cycle playlist)
        audio.addEventListener('ended', () => {
            loadTrack(currentTrack + 1, true);
        });

        audio.addEventListener('error', () => {
            trackName.textContent = '⚠️ File missing: ' + (playlist[currentTrack]?.file || '');
            trackName.style.color = '#f87171';
        });

        // =============== AUTO-PLAY ON PAGE LOAD ===============
        function tryAutoplay() {
            if (playlist.length === 0) return;
            loadTrack(0, false);

            // Strategy 1: Try normal autoplay first
            audio.play().then(() => {
                isPlaying = true;
                updatePlayStateUI();
            }).catch(() => {
                // Strategy 2: Try autoplay MUTED (browsers allow muted autoplay)
                audio.muted = true;
                isMuted = true;
                updateMuteUI();
                audio.play().then(() => {
                    isPlaying = true;
                    updatePlayStateUI();
                    // Show hint that user can unmute
                    trackName.textContent = '🔇 Playing muted - click Mute to unmute';
                    trackName.style.color = '#38bdf8';
                    setTimeout(() => { trackName.style.color = ''; updateTrackUI(); }, 4000);
                }).catch(() => {
                    // Strategy 3: Wait for FIRST user interaction anywhere
                    trackName.textContent = '👆 Click anywhere to start music';
                    trackName.style.color = '#facc15';
                    const startOnInteract = () => {
                        audio.muted = false;
                        isMuted = false;
                        audio.volume = 0.5;
                        volumeSlider.value = 50;
                        updateVolumeUI(50);
                        updateMuteUI();
                        playAudio();
                        document.removeEventListener('click', startOnInteract);
                        document.removeEventListener('scroll', startOnInteract);
                        document.removeEventListener('keydown', startOnInteract);
                        document.removeEventListener('touchstart', startOnInteract);
                    };
                    document.addEventListener('click', startOnInteract);
                    document.addEventListener('scroll', startOnInteract);
                    document.addEventListener('keydown', startOnInteract);
                    document.addEventListener('touchstart', startOnInteract);
                });
            });
        }

        // Kick off autoplay after a tiny delay so page loads first
        window.addEventListener('load', () => {
            setTimeout(tryAutoplay, 600);
        });

        // Init UI
        updateTrackUI();
        updatePlayStateUI();
        updateMuteUI();
    </script>
</body>
</html>
