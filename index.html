<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | @TUFAN1437</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=1.1">
</head>
<body class="bg-black text-white selection:bg-white/20">
    <div class="background-wrapper">
        <div class="background-image"></div>
    </div>
    <div id="particles-js"></div>

    <!-- Audio Control -->
    <div class="audio-control fixed left-6 bottom-6 z-50 group">
        <button id="audio-btn" class="audio-button relative flex items-center justify-center w-14 h-14 rounded-2xl glass-card border border-white/10 transition-all duration-300 overflow-hidden">
            <i class="fas fa-music text-xl text-sky-400 group-hover:text-white transition-colors"></i>
            <span class="sound-waves absolute inset-0 flex items-center justify-center gap-[2px] opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none">
                <span class="wave wave-1 bg-sky-400/80 rounded-full"></span>
                <span class="wave wave-2 bg-sky-400/80 rounded-full"></span>
                <span class="wave wave-3 bg-sky-400/80 rounded-full"></span>
                <span class="wave wave-4 bg-sky-400/80 rounded-full"></span>
                <span class="wave wave-5 bg-sky-400/80 rounded-full"></span>
            </span>
        </button>

        <!-- Sound Bar (Appears on Hover) -->
        <div class="sound-bar absolute left-full ml-4 bottom-0 px-5 py-4 rounded-2xl glass-card border border-white/10 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-400 translate-x-[-10px] group-hover:translate-x-0 min-w-[220px]">
            <div class="flex items-center justify-between mb-3">
                <span class="text-[11px] font-bold uppercase tracking-[0.2em] text-sky-400">Sound</span>
                <span id="volume-percent" class="text-[11px] font-bold text-white/80">50%</span>
            </div>
            
            <div class="volume-slider-container relative mb-4">
                <input type="range" id="volume-slider" min="0" max="100" value="50" class="volume-slider w-full">
                <div class="slider-track absolute top-1/2 left-0 h-1.5 w-full -translate-y-1/2 rounded-full bg-white/10"></div>
                <div id="slider-fill" class="slider-fill absolute top-1/2 left-0 h-1.5 -translate-y-1/2 rounded-full bg-gradient-to-r from-sky-500 to-sky-300 w-1/2"></div>
            </div>

            <div class="flex items-center gap-2">
                <button id="mute-btn" class="flex-1 flex items-center justify-center gap-2 py-2 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 hover:border-white/20 transition-all duration-300">
                    <i class="fas fa-volume-up text-sm text-white/70"></i>
                    <span class="text-xs font-semibold text-white/80">Mute</span>
                </button>
                <button id="track-btn" class="flex-1 flex items-center justify-center gap-2 py-2 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 hover:border-white/20 transition-all duration-300">
                    <i class="fas fa-forward text-sm text-white/70"></i>
                    <span class="text-xs font-semibold text-white/80">Next</span>
                </button>
            </div>
        </div>
    </div>

    <main class="relative min-h-screen flex items-center justify-center p-4">
        <!-- Profile Container -->
        <div class="profile-container w-full max-w-[450px] relative z-10 animate-fade-in">
            <!-- Background Card -->
            <div class="glass-card rounded-[2rem] p-8 text-center overflow-hidden border border-white/5 relative">
                
                <!-- Profile Header -->
                <div class="relative mb-6">
                    <div class="inline-block shadow-2xl">
                        <img src="avatar.png" alt="Avatar" class="w-24 h-24 rounded-full object-cover border-2 border-white/20">
                    </div>
                    <div class="mt-4">
                        <div class="flex items-center justify-center">
                            <div class="relative">
                                <h1 class="text-3xl font-bold tracking-tight">TUFAN</h1>
                                <span class="verified-badge absolute left-full ml-2 top-1/2 -translate-y-1/2 bg-blue-500 text-[10px] px-1.5 py-0.5 rounded-md font-black uppercase">Verified</span>
                            </div>
                        </div>
                        <p class="text-zinc-400 text-sm mt-1 font-medium">@TUFAN1437</p>
                    </div>
                </div>

                <!-- Description / Bio -->
                <div class="bio-section mb-8 px-4 flex flex-col items-center">
                    <div class="about-me-tag inline-block mb-3 px-4 py-1.5 rounded-full bg-white/5 border border-white/10 w-fit">
                        <span class="text-xs font-bold uppercase tracking-[0.25em] text-sky-400">About Me</span>
                    </div>
                    <p class="text-white text-lg font-bold tracking-tight typewriter">
                        MY BIRTHDAY <span class="text-sky-400">2007/04/23</span>
                    </p>
                </div>

                <!-- Social Links -->
                <div class="links-container space-y-3">
                    <a href="https://discordapp.com/users/1223946132074270822" target="_blank" class="social-button group flex items-center justify-between p-4 rounded-2xl bg-white/5 border border-white/5 hover:bg-white/10 hover:border-white/20 transition-all duration-300">
                        <div class="flex items-center gap-3">
                            <i class="fab fa-discord text-xl text-[#5865F2]"></i>
                            <span class="font-semibold text-sm">Discord</span>
                        </div>
                        <i class="fas fa-chevron-right text-xs text-zinc-500 group-hover:text-white transition-colors"></i>
                    </a>

                    <a href="https://www.youtube.com/@TUFAN_1_OnLy/shorts" target="_blank" class="social-button group flex items-center justify-between p-4 rounded-2xl bg-white/5 border border-white/5 hover:bg-white/10 hover:border-white/20 transition-all duration-300">
                        <div class="flex items-center gap-3">
                            <i class="fab fa-youtube text-xl text-[#FF0000]"></i>
                            <span class="font-semibold text-sm">YouTube</span>
                        </div>
                        <i class="fas fa-chevron-right text-xs text-zinc-500 group-hover:text-white transition-colors"></i>
                    </a>

                    <a href="#" class="social-button group flex items-center justify-between p-4 rounded-2xl bg-white/5 border border-white/5 hover:bg-white/10 hover:border-white/20 transition-all duration-300">
                        <div class="flex items-center gap-3">
                            <i class="fab fa-instagram text-xl text-[#E4405F]"></i>
                            <span class="font-semibold text-sm">Instagram</span>
                        </div>
                        <i class="fas fa-chevron-right text-xs text-zinc-500 group-hover:text-white transition-colors"></i>
                    </a>

                    <a href="#" class="social-button group flex items-center justify-between p-4 rounded-2xl bg-white/5 border border-white/5 hover:bg-white/10 hover:border-white/20 transition-all duration-300">
                        <div class="flex items-center gap-3">
                            <i class="fas fa-envelope text-xl text-blue-400"></i>
                            <span class="font-semibold text-sm">Contact</span>
                        </div>
                        <i class="fas fa-chevron-right text-xs text-zinc-500 group-hover:text-white transition-colors"></i>
                    </a>
                </div>

                <!-- Footer / Badges -->
                <div class="mt-8 pt-6 border-t border-white/5 flex justify-center gap-4">
                    <i class="fab fa-spotify text-xl grayscale opacity-50 hover:grayscale-0 hover:opacity-100 transition-all duration-300 cursor-pointer"></i>
                    <a href="https://steamcommunity.com/profiles/76561199697287632/" target="_blank" class="grayscale opacity-50 hover:grayscale-0 hover:opacity-100 transition-all duration-300">
                        <i class="fab fa-steam text-xl"></i>
                    </a>
                    <i class="fab fa-twitch text-xl grayscale opacity-50 hover:grayscale-0 hover:opacity-100 transition-all duration-300 cursor-pointer"></i>
                </div>
            </div>

            <!-- Profile Views Counter (Floating) -->
            <div class="mt-4 text-center">
                <span class="text-[10px] text-white font-bold uppercase tracking-[0.2em] drop-shadow-[0_0_10px_rgba(255,255,255,0.3)]">
                    <i class="far fa-eye mr-1"></i> <span id="view-count">...</span> views
                </span>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 120, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#ffffff" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.5, "random": true, "anim": { "enable": true, "speed": 1, "opacity_min": 0.1, "sync": false } },
                "size": { "value": 3, "random": true, "anim": { "enable": true, "speed": 2, "size_min": 0.1, "sync": false } },
                "line_linked": { "enable": false },
                "move": { "enable": true, "speed": 0.8, "direction": "top-right", "random": true, "straight": false, "out_mode": "out" }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": { "onhover": { "enable": true, "mode": "bubble" }, "onclick": { "enable": true, "mode": "push" } },
                "modes": { "bubble": { "distance": 250, "size": 0, "duration": 2, "opacity": 0, "speed": 3 }, "push": { "particles_nb": 4 } }
            }
        });

        // View Counter Logic
        async function updateViewCount() {
            try {
                const namespace = 'tufan1437.github.io';
                const name = 'profile-views';
                const storageKey = 'visited_tufan_profile';
                
                // Check if this person has already been counted
                const hasVisited = localStorage.getItem(storageKey);
                
                // If new visitor, use '/up' to increase. If returning, just get the current count.
                const endpoint = hasVisited ? 
                    `https://api.counterapi.dev/v1/${namespace}/${name}` : 
                    `https://api.counterapi.dev/v1/${namespace}/${name}/up`;

                const response = await fetch(endpoint);
                const data = await response.json();
                
                if (!hasVisited) {
                    localStorage.setItem(storageKey, 'true');
                }

                // Start counting from 1,337
                const totalViews = data.count + 1337;
                document.getElementById('view-count').innerText = totalViews.toLocaleString();
            } catch (error) {
                console.error('Error fetching view count:', error);
                document.getElementById('view-count').innerText = '1,337+';
            }
        }
        updateViewCount();

        // =============== Audio / Volume Slider Logic ===============
        const volumeSlider = document.getElementById('volume-slider');
        const sliderFill = document.getElementById('slider-fill');
        const volumePercent = document.getElementById('volume-percent');
        const muteBtn = document.getElementById('mute-btn');
        const audioBtn = document.getElementById('audio-btn');
        let lastVolume = 50;
        let isMuted = false;

        function updateVolumeUI(value) {
            const percent = value + '%';
            sliderFill.style.width = percent;
            volumePercent.textContent = percent;
        }

        volumeSlider.addEventListener('input', (e) => {
            const value = e.target.value;
            updateVolumeUI(value);
            if (value > 0) {
                isMuted = false;
                lastVolume = value;
                muteBtn.querySelector('i').className = 'fas fa-volume-up text-sm text-white/70';
                muteBtn.querySelector('span').textContent = 'Mute';
            } else {
                isMuted = true;
                muteBtn.querySelector('i').className = 'fas fa-volume-mute text-sm text-white/70';
                muteBtn.querySelector('span').textContent = 'Unmute';
            }
        });

        muteBtn.addEventListener('click', () => {
            if (isMuted) {
                isMuted = false;
                volumeSlider.value = lastVolume;
                updateVolumeUI(lastVolume);
                muteBtn.querySelector('i').className = 'fas fa-volume-up text-sm text-white/70';
                muteBtn.querySelector('span').textContent = 'Mute';
            } else {
                isMuted = true;
                lastVolume = volumeSlider.value || 50;
                volumeSlider.value = 0;
                updateVolumeUI(0);
                muteBtn.querySelector('i').className = 'fas fa-volume-mute text-sm text-white/70';
                muteBtn.querySelector('span').textContent = 'Unmute';
            }
        });
    </script>
</body>
</html>
